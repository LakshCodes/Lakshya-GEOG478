
<!DOCTYPE html>
<html>
<head>
    <title>Lakshya's First Web Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script>
        // Initialize the map
        var map = L.map('map').fitWorld();
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        
        // TAMU landmarks coordinates
        var kyleField = [30.6101, -96.34];
        var omBuilding = [30.6179, -96.3386];
        var academicBuilding = [30.6159, -96.3413];
        
        // Try to locate the user
        map.locate({setView: true, maxZoom: 16});
        
        // Location found event handler
        function onLocationFound(e) {
            var radius = e.accuracy / 2;
            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius + " meters from this point").openPopup();
            L.circle(e.latlng, radius).addTo(map);
        }
        
        // Location error event handler
        function onLocationError(e) {
            // If geolocation fails, center on Kyle Field
            map.setView(kyleField, 15);
            alert("Location access was denied or unavailable. Map centered on Kyle Field.");
        }
        
        var circle = L.circle([30.6101, -96.34], {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.5,
        radius: 200
        }).addTo(map);
        
        
        var onMIcon = L.icon({
        iconUrl: 'https://cdn.shopify.com/s/files/1/0589/4041/files/TAMU_-_Reveille_logo.png?v=1512245779',

        iconSize:     [30, 30], 
        iconAnchor:   [22, 94], 
        popupAnchor:  [-3, -76] 
        });

        var academicIcon = L.icon({
        iconUrl: 'https://upload.wikimedia.org/wikipedia/en/f/f7/Texas_A%26M_University_seal.svg',

        iconSize:     [30, 30],
        iconAnchor:   [22, 94],
        popupAnchor:  [-3, -76]
        });
        L.marker([30.6176890, -96.3366440], {icon: onMIcon}).addTo(map).bindPopup("O&M Building");
        L.marker([30.615667, -96.3409], {icon: academicIcon}).addTo(map).bindPopup("Academic Building");


        function onMapClick(e) {
            L.popup()
                .setLatLng(e.latlng)
                .setContent("You clicked the map at " + e.latlng.toString())
                .openOn(map);
        }
        
        // Register event handlers
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);
        map.on('click', onMapClick);
    </script>
</body>
</html>

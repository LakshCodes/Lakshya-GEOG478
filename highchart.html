=<!DOCTYPE html>
<html>
  <head>
    <title>Weekly Temperature in College Station Lakshya Verma</title>
    <style>
        #container {
            min-width: 310px;
            max-width: 900px;
            height: 500px;
            margin: 0 auto
        }
    </style>
  </head>
  <body>

    <div id="container"></div>

    <script src="https://code.highcharts.com/highcharts.js" crossorigin="anonymous"></script>
    <script src="https://code.highcharts.com/modules/series-label.js" crossorigin="anonymous"></script>
    <script src="https://code.highcharts.com/modules/exporting.js" crossorigin="anonymous"></script>

    <script>

        //highcharts main code  
      Highcharts.chart('container', {
          title: { text: 'Weekly Temperature in College Station' },
          subtitle: { text: 'College Station Weekly Temperature Forecast' },
          yAxis: { title: { text: 'Temperature (°F)' }, min: 40, max: 90 },
          xAxis: { categories: ['Sat','Sun','Mon','Tue','Wed','Thu','Fri','Sat'] },
          legend: { layout: 'vertical', align: 'right', verticalAlign: 'middle' },
          plotOptions: { series: { label: { connectorAllowed: false } } },
          series: [{
              name: 'Highest',
              data: [82, 81, 81, 70, 77, 78, 79, 80]
          }, {
              name: 'Lowest',
              data: [67, 59, 50, 47, 51, 60, 66, 66]
          }],
          responsive: {
              rules: [{
                  condition: { maxWidth: 500 },
                  chartOptions: {
                      legend: {
                          layout: 'horizontal',
                          align: 'center',
                          verticalAlign: 'bottom'
                      }
                  }
              }]
          }
      });
    </script>

  </body>
</html>
